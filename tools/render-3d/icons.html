<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Render · Ícones 3D do ecossistema</title>
<style>html,body{margin:0;background:transparent;overflow:hidden}canvas{display:block}</style>
<script type="importmap">
{ "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<script type="module">
/*
 * Ícones 3D das quatro frentes (Consulting, Marketing, Studios, Tech) — render OFFLINE, mesma linguagem da
 * escultura "Asa Grifo": preto acetinado laqueado, lateral em metal grafite, detalhe âmbar, estúdio de softboxes.
 * Parâmetros: icon=consulting|marketing|studios|tech · w · h
 */
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const q = new URLSearchParams(location.search);
const W = +(q.get('w') || 720), H = +(q.get('h') || 720);
const icon = q.get('icon') || 'consulting';

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(2);
renderer.setSize(W, H);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.AgXToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();

/* Estúdio: o mesmo ambiente de reflexos da escultura (softboxes + faixa âmbar discreta) */
function studio() {
  const env = new THREE.Scene();
  env.background = new THREE.Color(0x050505);
  const box = (w, h, color, k, pos, rot) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(color).multiplyScalar(k), side: THREE.DoubleSide }));
    m.position.set(...pos); m.rotation.set(...rot); env.add(m);
  };
  box(5, 2.2, 0xffffff, 3.2, [-1, 6, 1.5], [Math.PI / 2, 0, 0]);
  box(0.8, 10, 0xffffff, 5.0, [-6, 1, 2], [0, Math.PI / 2, 0]);
  box(0.4, 10, 0xffffff, 3.5, [6, 1, -1], [0, -Math.PI / 2, 0]);
  box(10, 0.35, 0xffffff, 3.0, [0, 3.2, 6], [0, Math.PI, 0]);
  box(10, 0.25, 0xffffff, 1.4, [0, -2.2, 6], [0, Math.PI, 0]);
  box(0.35, 7, 0xffa630, 2.6, [3.5, 0.5, 5], [0, Math.PI, 0]);
  const gc = document.createElement('canvas'); gc.width = 8; gc.height = 256;
  const gg = gc.getContext('2d'); const lg = gg.createLinearGradient(0, 0, 0, 256);
  lg.addColorStop(0, '#ffffff'); lg.addColorStop(0.35, '#9a9a9a'); lg.addColorStop(0.7, '#161616'); lg.addColorStop(1, '#000000');
  gg.fillStyle = lg; gg.fillRect(0, 0, 8, 256);
  const gt = new THREE.CanvasTexture(gc); gt.colorSpace = THREE.SRGBColorSpace;
  const front = new THREE.Mesh(new THREE.PlaneGeometry(16, 9), new THREE.MeshBasicMaterial({ map: gt, side: THREE.DoubleSide, color: new THREE.Color(1.25, 1.25, 1.25) }));
  front.position.set(-2, 1.5, 8); front.rotation.set(0, Math.PI, 0); env.add(front);
  return env;
}
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(studio(), 0.02).texture;
scene.environmentIntensity = 2.4;

const M = {
  black: new THREE.MeshPhysicalMaterial({ color: 0x232327, roughness: 0.28, metalness: 0.2, clearcoat: 1, clearcoatRoughness: 0.05 }), // grafite laqueado (lê bem sobre o cartão escuro)
  metal: new THREE.MeshPhysicalMaterial({ color: 0x6b6b70, roughness: 0.2, metalness: 1.0 }),
  steel: new THREE.MeshPhysicalMaterial({ color: 0xc9c9cd, roughness: 0.16, metalness: 1.0 }),
  amber: new THREE.MeshPhysicalMaterial({ color: 0xe5a12e, roughness: 0.24, metalness: 1.0 }),
};
const ext = (shape, depth, bevel = 0.05) => {
  const g = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel * 0.8, bevelSegments: 12, curveSegments: 64 });
  g.center(); g.computeVertexNormals(); return g;
};
const group = new THREE.Group();
scene.add(group);

if (icon === 'consulting') {
  // Bússola: direção estratégica — anel metálico, mostrador preto, agulha com ponta âmbar
  const ring = new THREE.Mesh(new THREE.TorusGeometry(1, 0.13, 48, 160), M.steel);
  const dial = new THREE.Mesh(new THREE.CylinderGeometry(0.93, 0.93, 0.14, 128), M.black);
  dial.rotation.x = Math.PI / 2; dial.position.z = -0.04;
  const half = (sign) => { const s = new THREE.Shape(); s.moveTo(0, 0.0); s.lineTo(0.17, 0); s.lineTo(0, 0.78 * sign); s.lineTo(-0.17, 0); s.lineTo(0, 0); return s; };
  const n = new THREE.Mesh(ext(half(1), 0.08, 0.03), M.amber); n.position.set(0, 0.36, 0.12);
  const sth = new THREE.Mesh(ext(half(-1), 0.08, 0.03), M.metal); sth.position.set(0, -0.36, 0.12);
  const needle = new THREE.Group(); needle.add(n, sth); needle.rotation.z = -0.62;
  const cap = new THREE.Mesh(new THREE.SphereGeometry(0.1, 48, 32), M.steel); cap.position.z = 0.2;
  const ticks = new THREE.Group();
  for (let i = 0; i < 4; i++) { const t = new THREE.Mesh(new RoundedBoxGeometry(0.05, 0.16, 0.05, 3, 0.02), M.metal); const a = (i * Math.PI) / 2; t.position.set(Math.sin(a) * 0.74, Math.cos(a) * 0.74, 0.06); t.rotation.z = -a; ticks.add(t); }
  group.add(ring, dial, needle, cap, ticks);
  group.rotation.set(-0.5, 0.55, 0.08);
}

if (icon === 'marketing') {
  // Megafone: campanhas e comunicação — corneta preta, aro âmbar, cabo e traseira em metal
  const bell = new THREE.Mesh(new THREE.CylinderGeometry(0.72, 0.26, 1.25, 96, 1, true), M.black);
  bell.material = M.black.clone(); bell.material.side = THREE.DoubleSide;
  const inner = new THREE.Mesh(new THREE.CylinderGeometry(0.66, 0.24, 1.2, 96, 1, true), new THREE.MeshPhysicalMaterial({ color: 0x232326, roughness: 0.5, metalness: 0.3, side: THREE.BackSide }));
  const rim = new THREE.Mesh(new THREE.TorusGeometry(0.71, 0.06, 32, 128), M.amber); rim.rotation.x = Math.PI / 2; rim.position.y = 0.625;
  const back = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.38, 64), M.metal); back.position.y = -0.8;
  const backCap = new THREE.Mesh(new THREE.SphereGeometry(0.3, 48, 24, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2), M.metal); backCap.position.y = -0.99;
  const handle = new THREE.Mesh(new RoundedBoxGeometry(0.2, 0.62, 0.24, 6, 0.08), M.black); handle.position.set(0.42, -0.5, 0); handle.rotation.z = -0.25;
  const horn = new THREE.Group(); horn.add(bell, inner, rim, back, backCap, handle);
  horn.rotation.z = -Math.PI / 2 + 0.32; // aponta para a direita, levemente para cima
  group.add(horn);
  group.rotation.set(0.1, -0.55, 0);
}

if (icon === 'studios') {
  // Claquete: filmes e conteúdo — corpo preto, barras com listras âmbar, dobradiça metálica
  const body = new THREE.Mesh(new RoundedBoxGeometry(1.7, 1.15, 0.2, 6, 0.06), M.black);
  // listras em paralelogramo (cisalhamento) contidas na altura da barra
  const stripes = (bar, flip) => {
    for (let i = 0; i < 4; i++) {
      const g = new THREE.BoxGeometry(0.17, 0.2, 0.03);
      g.applyMatrix4(new THREE.Matrix4().makeShear(0, 0, flip ? -0.55 : 0.55, 0, 0, 0));
      const st = new THREE.Mesh(g, i % 2 ? M.amber : M.steel);
      st.position.set(-0.6 + i * 0.4, 0, 0.105);
      bar.add(st);
    }
  };
  const lower = new THREE.Mesh(new RoundedBoxGeometry(1.7, 0.27, 0.2, 6, 0.05), M.black); lower.position.y = 0.73;
  stripes(lower, false);
  const pivot = new THREE.Group(); pivot.position.set(-0.85, 0.88, 0);
  const upper = new THREE.Mesh(new RoundedBoxGeometry(1.7, 0.27, 0.2, 6, 0.05), M.black); upper.position.set(0.85, 0.14, 0);
  stripes(upper, true);
  pivot.add(upper); pivot.rotation.z = 0.32;
  const hinge = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.24, 32), M.steel); hinge.rotation.x = Math.PI / 2; hinge.position.set(-0.82, 0.88, 0);
  const lines = new THREE.Group();
  for (let i = 0; i < 3; i++) { const l = new THREE.Mesh(new RoundedBoxGeometry(1.25 - i * 0.3, 0.035, 0.02, 2, 0.01), M.metal); l.position.set(-0.15 - i * 0.15, 0.18 - i * 0.28, 0.11); lines.add(l); }
  group.add(body, lower, pivot, hinge, lines);
  group.rotation.set(-0.18, 0.55, 0.04);
}

if (icon === 'tech') {
  // </> : websites e sistemas — chaves pretas, barra âmbar
  const chevron = (dir) => {
    const t = 0.2, L = 0.6, a = 0.72;
    const s = new THREE.Shape();
    s.moveTo(0, 0); s.lineTo(L * Math.cos(a), L * Math.sin(a)); s.lineTo(L * Math.cos(a) + t, L * Math.sin(a));
    s.lineTo(t * 1.25, 0); s.lineTo(L * Math.cos(a) + t, -L * Math.sin(a)); s.lineTo(L * Math.cos(a), -L * Math.sin(a)); s.lineTo(0, 0);
    const m = new THREE.Mesh(ext(s, 0.24, 0.06), [M.black, M.metal]);
    if (dir > 0) m.rotation.y = Math.PI;
    return m;
  };
  const left = chevron(-1); left.position.x = -0.66;
  const right = chevron(1); right.position.x = 0.7;
  const sl = new THREE.Shape(); sl.moveTo(-0.1, -0.6); sl.lineTo(0.07, -0.6); sl.lineTo(0.27, 0.6); sl.lineTo(0.1, 0.6); sl.lineTo(-0.1, -0.6);
  const slash = new THREE.Mesh(ext(sl, 0.24, 0.05), M.amber); slash.position.x = -0.02;
  group.add(left, right, slash);
  group.rotation.set(-0.22, 0.6, 0.05);
}

/* ── Especialidades (mesma linguagem): imobiliário, educação, tecnologia, concessionárias ── */
if (icon === 'imobiliario') {
  // Duas torres: volumes pretos, janelas em faixas metálicas, coroamento âmbar na torre principal
  const tower = (w, h, d, floors) => {
    const g = new THREE.Group();
    const b = new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 6, 0.05), M.black); b.position.y = h / 2; g.add(b);
    for (let i = 0; i < floors; i++) {
      const y = 0.22 + i * ((h - 0.42) / (floors - 1 || 1));
      const f = new THREE.Mesh(new RoundedBoxGeometry(w * 0.78, 0.05, 0.03, 2, 0.01), M.metal); f.position.set(0, y, d / 2 + 0.005); g.add(f);
      const s = new THREE.Mesh(new RoundedBoxGeometry(0.03, 0.05, d * 0.78, 2, 0.01), M.metal); s.position.set(w / 2 + 0.005, y, 0); g.add(s);
    }
    return g;
  };
  const a = tower(0.62, 1.9, 0.62, 7); a.position.set(-0.22, -0.95, 0);
  const crown = new THREE.Mesh(new RoundedBoxGeometry(0.66, 0.08, 0.66, 4, 0.03), M.amber); crown.position.set(-0.22, 0.98, 0);
  const b = tower(0.52, 1.15, 0.52, 4); b.position.set(0.42, -0.95, 0.28);
  const base = new THREE.Mesh(new RoundedBoxGeometry(1.7, 0.08, 1.25, 4, 0.03), M.steel); base.position.set(0.08, -0.99, 0.12);
  group.add(a, crown, b, base);
  group.rotation.set(0.32, -0.62, 0);
}

if (icon === 'educacao') {
  // Capelo: tampo preto, copa metálica, cordão e borla em âmbar
  const board = new THREE.Mesh(new RoundedBoxGeometry(1.75, 0.08, 1.75, 4, 0.03), M.black); board.rotation.y = Math.PI / 4;
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.56, 0.62, 0.48, 96, 1), M.metal); cap.position.y = -0.27;
  const band = new THREE.Mesh(new THREE.TorusGeometry(0.6, 0.035, 24, 120), M.steel); band.rotation.x = Math.PI / 2; band.position.y = -0.48;
  const button = new THREE.Mesh(new THREE.SphereGeometry(0.07, 32, 24), M.amber); button.position.y = 0.07;
  const cord = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.92, 16), M.amber); cord.rotation.z = Math.PI / 2; cord.position.set(0.46, 0.06, 0);
  const drop = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.5, 16), M.amber); drop.position.set(0.92, -0.18, 0);
  const tassel = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.1, 0.26, 32), M.amber); tassel.position.set(0.92, -0.52, 0);
  group.add(board, cap, band, button, cord, drop, tassel);
  group.rotation.set(0.42, -0.5, -0.06);
}

if (icon === 'tecnologia') {
  // Chip: corpo preto, pinos metálicos nos quatro lados, núcleo âmbar
  const body = new THREE.Mesh(new RoundedBoxGeometry(1.35, 1.35, 0.2, 6, 0.06), M.black);
  const core = new THREE.Mesh(new RoundedBoxGeometry(0.56, 0.56, 0.08, 4, 0.03), M.amber); core.position.z = 0.12;
  const frame = new THREE.Mesh(new RoundedBoxGeometry(0.78, 0.78, 0.04, 4, 0.02), M.metal); frame.position.z = 0.09;
  group.add(body, frame, core);
  for (let side = 0; side < 4; side++) {
    for (let i = 0; i < 5; i++) {
      const p = new THREE.Mesh(new RoundedBoxGeometry(0.09, 0.3, 0.06, 2, 0.02), M.steel);
      const o = -0.48 + i * 0.24, a = (side * Math.PI) / 2;
      p.position.set(Math.cos(a) * 0.78 - Math.sin(a) * o, Math.sin(a) * 0.78 + Math.cos(a) * o, 0);
      p.rotation.z = a + Math.PI / 2;
      group.add(p);
    }
  }
  group.rotation.set(-0.55, 0.55, 0.12);
}

if (icon === 'concessionarias') {
  // Volante: aro metálico, raios e cubo pretos, emblema âmbar
  const ringO = new THREE.Mesh(new THREE.TorusGeometry(1, 0.12, 48, 180), M.black);
  const ringI = new THREE.Mesh(new THREE.TorusGeometry(1, 0.06, 24, 180), M.steel); ringI.position.z = 0.09; ringI.scale.set(0.96, 0.96, 1);
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.38, 0.22, 96), M.black); hub.rotation.x = Math.PI / 2;
  const badge = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.06, 64), M.amber); badge.rotation.x = Math.PI / 2; badge.position.z = 0.13;
  const spoke = (a) => { const s = new THREE.Mesh(new RoundedBoxGeometry(0.62, 0.17, 0.1, 4, 0.04), M.metal); s.position.set(Math.cos(a) * 0.62, Math.sin(a) * 0.62, 0); s.rotation.z = a; return s; };
  group.add(ringO, ringI, hub, badge, spoke(0), spoke(Math.PI), spoke(-Math.PI / 2));
  group.rotation.set(-0.42, 0.58, 0.06);
}

const key = new THREE.DirectionalLight(0xffffff, 1.2); key.position.set(-3, 5, 4); scene.add(key);
const rim = new THREE.DirectionalLight(0xffffff, 2.6); rim.position.set(4, 2, -5); scene.add(rim);
scene.add(new THREE.HemisphereLight(0xffffff, 0x222222, 0.2));

// enquadramento: centraliza e ajusta pela esfera envolvente (todos os ícones com o mesmo "tamanho visual")
group.updateMatrixWorld(true);
const box = new THREE.Box3().setFromObject(group);
const c = box.getCenter(new THREE.Vector3());
group.position.sub(c);
const r = box.getBoundingSphere(new THREE.Sphere()).radius;
const camera = new THREE.PerspectiveCamera(26, W / H, 0.1, 100);
const d = r / Math.sin(THREE.MathUtils.degToRad(13)) * 1.08;
camera.position.set(-0.25 * d * 0.1, 0.12 * d * 0.1, d);
camera.lookAt(0, 0, 0);

window.renderFrame = () => { renderer.render(scene, camera); return true; };
window.renderFrame();
window.__ready = true;
</script>
</body>
</html>
